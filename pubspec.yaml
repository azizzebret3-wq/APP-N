name: nourou_academy
description: Application mobile de formation Nourou Academy
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  flutter_animate: ^4.5.2
  rive: ^0.14.11
  lottie: ^3.8.2
  google_fonts: ^9.0.0
  sensors_plus: ^7.1.1
  flutter_secure_storage: ^11.2.0
  drift: ^2.35.4
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/shaders/
